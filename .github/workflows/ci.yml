name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, format, file hygiene and secret scanning, all defined in
  # .pre-commit-config.yaml. Contributors run the same hooks on commit.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Django system checks
        run: uv run --locked python manage.py check
      - name: No missing migrations
        run: uv run --locked python manage.py makemigrations --check --dry-run
      - name: Bandit
        run: uv run --locked bandit -c pyproject.toml -r apps kamikon manage.py
      - name: Dependency audit
        run: uv run --locked pip-audit

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kamikon
          POSTGRES_USER: kamikon
          POSTGRES_PASSWORD: kamikon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-for-tests-0123456789-abcdefghijklmnopqrstuvwxyz
      ALLOWED_HOSTS: localhost
      DB_NAME: kamikon
      DB_USER: kamikon
      DB_PASSWORD: kamikon
      DB_HOST: localhost
      DB_PORT: "5432"
      SMTP_HOST: smtp.example.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv run --locked pytest --cov --cov-report=term-missing

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1.80.4
        with:
          fail_level: error
